<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BI-VM</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { overflow: hidden; }
    body.autosize { overflow: auto; height: auto; }
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index:100; padding:20px; box-sizing:border-box;
      font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#6b6a63;background:#fafaf8;
    }
    #loader[hidden]{display:none!important}
    .startup-card{width:430px;max-width:100%;box-sizing:border-box;padding:26px 28px;text-align:center;border:1px solid #dedbd4;border-radius:14px;background:#fff;box-shadow:0 18px 54px rgba(0,0,0,.12)}
    .startup-spinner{width:34px;height:34px;box-sizing:border-box;margin:0 auto 16px;border:4px solid #eadbd7;border-top-color:#c0392b;border-radius:50%;animation:startupSpin .8s linear infinite}
    #startupTitle{font-size:18px;line-height:1.4;font-weight:600;color:#30312d}
    #startupDetail{font-size:13px;line-height:1.6;margin-top:8px}
    #startupRetry{min-height:42px;margin-top:18px;padding:9px 16px;border:1px solid #dedbd4;border-radius:7px;background:#fff;color:#84372d;font:inherit;cursor:pointer}
    #startupRetry[hidden]{display:none!important}
    #startupRetry:focus-visible{outline:2px solid #c0392b;outline-offset:3px}
    @keyframes startupSpin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.startup-spinner{animation:none}}
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
    body.autosize iframe { position: static; width: 100%; }
    body.viewport-layout { height: 100%; overflow: hidden; }
    body.viewport-layout iframe { position: fixed; inset: 0; width: 100%; height: 100% !important; }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite" aria-busy="true">
    <div class="startup-card"><div class="startup-spinner" aria-hidden="true"></div>
      <div id="startupTitle">Загружаем систему…</div>
      <div id="startupDetail">Подключаемся к BI. Пожалуйста, подождите.</div>
      <button id="startupRetry" type="button" hidden>Повторить загрузку</button>
    </div>
  </div>
  <output id="biStartupDiagnostics" hidden aria-hidden="true"></output>
  <iframe id="app" title="Стоматология BI" inert data-src="https://script.google.com/macros/s/AKfycby3o5H3hr6dJ5O9ZBtkeCTHMKJa5WHbG4fPFAxvlN3SP5ERU-S3iOiSQzipkAdTybaZfA/exec"></iframe>
  <script id="bi-startup-host">
  // Startup presentation only. Existing session/access/reload bridges below stay intact.
  (function(){
    'use strict';
    var app=document.getElementById('app'),loader=document.getElementById('loader'),title=document.getElementById('startupTitle'),detail=document.getElementById('startupDetail'),retry=document.getElementById('startupRetry'),diagnostics=document.getElementById('biStartupDiagnostics');
    var state=null,timer=null,legacyTimer=null;
    function allowed(e){return (e.origin==='https://script.google.com'||/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin))&&typeof isAppDescendant==='function'&&isAppDescendant(e.source);}
    function record(phase){state.phase=phase;state.events.push({phase:phase,ms:Math.round(performance.now()-state.started),at:Date.now()});if(state.events.length>32)state.events.shift();diagnostics.textContent=JSON.stringify({schema:1,id:state.id,startedAt:state.startedAt,phase:state.phase,events:state.events,server:state.server||null});loader.dataset.phase=phase;}
    function begin(reload){
      clearTimeout(timer);clearTimeout(legacyTimer);var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);var id=Array.from(bytes,function(n){return n.toString(16).padStart(2,'0');}).join('');
      state={id:id,started:performance.now(),startedAt:Date.now(),phase:'google',events:[],settled:false,source:null,origin:'',seq:0,server:null};
      loader.hidden=false;loader.setAttribute('aria-busy','true');app.inert=true;retry.hidden=true;title.textContent='Загружаем систему…';detail.textContent='Подключаемся к BI. Пожалуйста, подождите.';record('google');
      var url=new URL(reload?app.src:app.getAttribute('data-src'));url.searchParams.set('biStartup',id);app.setAttribute('data-src',url.href);if(reload)app.src=url.href;
      var attempt=state;timer=setTimeout(function(){if(state!==attempt||state.settled)return;title.textContent='Загрузка занимает больше обычного';detail.textContent=state.phase==='google'?'Ждём ответ Google. Можно подождать или повторить загрузку.':'Проверка входа ещё продолжается. Можно подождать или повторить загрузку.';retry.hidden=false;record(state.phase);},25000);
    }
    function settle(phase){if(state.settled)return;state.settled=true;clearTimeout(timer);clearTimeout(legacyTimer);record(phase);loader.setAttribute('aria-busy','false');loader.hidden=true;app.inert=false;}
    retry.addEventListener('click',function(){if(!state.settled)begin(true);});
    window.addEventListener('message',function(e){
      var m=e.data;if(!m||!allowed(e))return;
      // Compatibility with older BI pages: their viewport request is sent only
      // after the existing visible login gate has been parsed. Never use onload.
      if(m.type==='bi-viewport-request'&&!state.source&&!state.settled){clearTimeout(legacyTimer);var legacyAttempt=state;legacyTimer=setTimeout(function(){if(state===legacyAttempt&&!state.source&&!state.settled)settle('legacy-ui');},2500);return;}
      if(m.type!=='bi-startup-state'||m.schema!==1||m.id!==state.id||!Number.isSafeInteger(m.seq)||m.seq<=state.seq||!['session','access','interactive','ready'].includes(m.phase))return;
      if(state.source&&(state.source!==e.source||state.origin!==e.origin))return;
      if(!m.server||m.server.schema!==1||m.server.id!==state.id)return;
      var server={schema:1,id:state.id};for(var k of ['enteredAt','renderedAt','renderMs','entryMs']){if(!Number.isSafeInteger(m.server[k])||m.server[k]<0)return;server[k]=m.server[k];}
      if(server.enteredAt<=0||server.renderedAt-server.enteredAt!==server.entryMs||server.renderMs>server.entryMs)return;
      state.source=e.source;state.origin=e.origin;state.seq=m.seq;state.server=server;clearTimeout(legacyTimer);
      if(state.settled)return;
      if(m.phase==='ready'||m.phase==='interactive'){settle(m.phase);return;}
      title.textContent=m.phase==='access'?'Проверяем доступ…':'Проверяем вход…';detail.textContent='Подготавливаем ваш рабочий экран. Пожалуйста, подождите.';record(m.phase);
    });
    begin(false);
  })();
  </script>
  <script>
    // ─── АВТОРАЗМЕР IFRAME ───────────────────────────────────────
    // Приложение внутри iframe (см. Index.html в Apps Script) каждые 600мс шлёт свою
    // реальную высоту через window.top.postMessage({ fdHeight: ... }, '*'). Здесь мы
    // ловим это сообщение и растягиваем iframe под контент, чтобы скроллилась только
    // родительская страница (нативно, без двойного скролла и тормозов).
    var iframe = document.getElementById('app');
    // Forward only an opaque request ID; access is checked inside the BI after login.
    var appUrl = new URL(iframe.getAttribute('data-src'));
    var requestId = new URLSearchParams(window.location.search).get('financeRequest');
    if (requestId && /^[a-zA-Z0-9-]{1,100}$/.test(requestId)) {
      appUrl.searchParams.set('financeRequest', requestId);
    }
    iframe.src = appUrl.href;
    var sessionKey = 'biVmSession';
    // The app asks from its Apps Script sandbox. Send CSS viewport dimensions,
    // not screen pixels, and keep the outer frame independent of content height.
    var viewportClient = null, viewportOrigin = '', viewportRequest = 0;
    var systemReloadRequest = '';
    function isAppDescendant(source) {
      try {
        for (var depth = 0; source && depth < 8; depth++) {
          if (source === iframe.contentWindow) return true;
          if (source.parent === source) break;
          source = source.parent;
        }
      } catch (ignore) {}
      return false;
    }
    function sendViewport() {
      if (!viewportClient) return;
      viewportClient.postMessage({type:'bi-viewport', height:window.innerHeight,
        width:document.documentElement.clientWidth}, viewportOrigin);
    }
    function scheduleViewport() {
      cancelAnimationFrame(viewportRequest);
      viewportRequest = requestAnimationFrame(sendViewport);
    }
    window.addEventListener('resize', scheduleViewport);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleViewport);
    window.addEventListener('message', function (e) {
      // Only the registered app sandbox can request a user-confirmed page reload.
      if (e.data && e.data.type === 'bi-system-reload-request' &&
          e.source === viewportClient && e.origin === viewportOrigin &&
          isAppDescendant(e.source) &&
          /^[a-z0-9-]{24,80}$/i.test(String(e.data.requestId || ''))) {
        if (systemReloadRequest === e.data.requestId) return;
        systemReloadRequest = e.data.requestId;
        e.source.postMessage({type:'bi-system-reload-accepted',requestId:e.data.requestId}, e.origin);
        setTimeout(function () { window.location.reload(); }, 0);
        return;
      }
      if (e.data && e.data.type === 'bi-viewport-request' &&
          (e.origin === 'https://script.google.com' || /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin))) {
        viewportClient = e.source; viewportOrigin = e.origin;
        document.body.classList.remove('autosize');
        document.body.classList.add('viewport-layout');
        iframe.style.removeProperty('height');
        sendViewport();
        return;
      }
      if (e.source !== iframe.contentWindow) return;
      if (e.data && e.data.type === 'bi-session-store') {
        localStorage.setItem(sessionKey, JSON.stringify(e.data.session));
        return;
      }
      if (e.data && e.data.type === 'bi-session-clear') {
        localStorage.removeItem(sessionKey);
        return;
      }
      if (e.data && e.data.type === 'bi-session-request') {
        var session = null;
        try { session = JSON.parse(localStorage.getItem(sessionKey) || 'null'); } catch (ignore) {}
        iframe.contentWindow.postMessage({ type: 'bi-session-value', session: session }, '*');
        return;
      }
      var h = e.data && e.data.fdHeight;
      if (!viewportClient && typeof h === 'number' && h > 200 && h < 50000) {
        document.body.classList.add('autosize');
        iframe.style.height = h + 'px';
      }
    });
  </script>
  <script src="/reserve-bridge.js"></script>
</body>
</html>
