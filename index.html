<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BI-VM</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body { overflow: hidden; }
    body.autosize { overflow: auto; height: auto; }
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #6b6a63; background: #fafaf8;
    }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
    body.autosize iframe { position: static; width: 100%; }
    body.viewport-layout { height: 100%; overflow: hidden; }
    body.viewport-layout iframe { position: fixed; inset: 0; width: 100%; height: 100% !important; }
  </style>
</head>
<body>
  <div id="loader">Загрузка…</div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycby3o5H3hr6dJ5O9ZBtkeCTHMKJa5WHbG4fPFAxvlN3SP5ERU-S3iOiSQzipkAdTybaZfA/exec"
    onload="document.getElementById('loader').style.display='none'"></iframe>
  <script>
    // ─── АВТОРАЗМЕР IFRAME ───────────────────────────────────────
    // Приложение внутри iframe (см. Index.html в Apps Script) каждые 600мс шлёт свою
    // реальную высоту через window.top.postMessage({ fdHeight: ... }, '*'). Здесь мы
    // ловим это сообщение и растягиваем iframe под контент, чтобы скроллилась только
    // родительская страница (нативно, без двойного скролла и тормозов).
    var iframe = document.getElementById('app');
    var sessionKey = 'biVmSession';
    // The app asks from its Apps Script sandbox. Send CSS viewport dimensions,
    // not screen pixels, and keep the outer frame independent of content height.
    var viewportClient = null, viewportOrigin = '', viewportRequest = 0;
    function sendViewport() {
      if (!viewportClient) return;
      viewportClient.postMessage({type:'bi-viewport', height:window.innerHeight,
        width:document.documentElement.clientWidth}, viewportOrigin);
    }
    function scheduleViewport() {
      cancelAnimationFrame(viewportRequest);
      viewportRequest = requestAnimationFrame(sendViewport);
    }
    window.addEventListener('resize', scheduleViewport);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleViewport);
    window.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'bi-viewport-request' &&
          (e.origin === 'https://script.google.com' || /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin))) {
        viewportClient = e.source; viewportOrigin = e.origin;
        document.body.classList.remove('autosize');
        document.body.classList.add('viewport-layout');
        iframe.style.removeProperty('height');
        sendViewport();
        return;
      }
      if (e.source !== iframe.contentWindow) return;
      if (e.data && e.data.type === 'bi-session-store') {
        localStorage.setItem(sessionKey, JSON.stringify(e.data.session));
        return;
      }
      if (e.data && e.data.type === 'bi-session-clear') {
        localStorage.removeItem(sessionKey);
        return;
      }
      if (e.data && e.data.type === 'bi-session-request') {
        var session = null;
        try { session = JSON.parse(localStorage.getItem(sessionKey) || 'null'); } catch (ignore) {}
        iframe.contentWindow.postMessage({ type: 'bi-session-value', session: session }, '*');
        return;
      }
      var h = e.data && e.data.fdHeight;
      if (!viewportClient && typeof h === 'number' && h > 200 && h < 50000) {
        document.body.classList.add('autosize');
        iframe.style.height = h + 'px';
      }
    });
  </script>
</body>
</html>
